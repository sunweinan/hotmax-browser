<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Hotmax Browser</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="shell.css" />
    <link rel="icon" href="../assets/icon.png" />
  </head>
  <body>
    <div id="titlebar">
      <div id="tabs" role="tablist" aria-label="网页标签"></div>
      <button id="add" title="新建标签页" aria-label="新建标签页">＋</button>
    </div>
    <form id="nav">
      <button
        class="nav-icon"
        type="button"
        data-action="back"
        title="后退"
        aria-label="后退"
      >
        ←</button
      ><button
        class="nav-icon"
        type="button"
        data-action="forward"
        title="前进"
        aria-label="前进"
      >
        →</button
      ><button
        class="nav-icon"
        type="button"
        data-action="reload"
        title="刷新"
        aria-label="刷新"
      >
        ↻</button
      ><input
        id="url"
        aria-label="地址"
        spellcheck="false"
        autocomplete="off"
      /><span id="error" role="status"></span>
    </form>
    <script type="module" src="shell.js"></script>
  </body>
</html>
